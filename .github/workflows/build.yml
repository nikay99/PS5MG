name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PS5 title: trellis.cpp with ggml-vulkan on RADV, cross-built with PS5_Vulkan's toolchain through
  # the PS5SD submodule (its docker image, setup-deps.sh and ps5-opengl SDK). The repository is mounted at /work.
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE: ps5sd-build
      PS5SD: third_party/PS5SD
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Submodules
        run: |
          git submodule update --init third_party/PS5SD
          git -C third_party/PS5SD submodule update --init third_party/ps5-homebrew-ui third_party/ftpsrv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # RADV's build tree and the toolchain take several GiB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: third_party/PS5SD/docker
          file: third_party/PS5SD/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # restore and save apart, so a failure further down still leaves the toolchain cached
      - name: Cache .deps
        id: depscache
        uses: actions/cache/restore@v4
        with:
          path: third_party/PS5SD/.deps
          key: ps5mg-deps-${{ runner.os }}-${{ hashFiles('third_party/PS5SD/scripts/setup-deps.sh', 'third_party/PS5SD/scripts/build-opengl-sdk.sh', 'third_party/PS5SD/patches/mesa/**') }}
          restore-keys: |
            ps5mg-deps-${{ runner.os }}-

      # ps5-opengl built from source takes the better part of an hour: a cache of its own, saved as soon as built.
      - name: Restore the ps5-opengl SDK
        id: glcache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/PS5SD/.deps/ps5-opengl-sdk
            third_party/PS5SD/.deps/ps5-opengl-sdk.stamp
          key: ps5-opengl-sdk-${{ hashFiles('third_party/PS5SD/scripts/build-opengl-sdk.sh') }}

      - name: Dependencies (PS5_Vulkan, RADV, payload SDK, ps5-opengl)
        env:
          PS5SD_DISPLAY: "1"
        run: |
          docker run --rm --platform linux/amd64 -e PS5SD_DISPLAY -v "$PWD":/work -w /work/third_party/PS5SD "$IMAGE" \
            bash -c 'git config --global --add safe.directory "*" && bash scripts/setup-deps.sh'

      - name: Save .deps
        if: always() && steps.depscache.outputs.cache-hit != 'true' && hashFiles('third_party/PS5SD/.deps/src/PS5_Vulkan/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a') != ''
        uses: actions/cache/save@v4
        with:
          path: third_party/PS5SD/.deps
          key: ${{ steps.depscache.outputs.cache-primary-key }}

      - name: Save the ps5-opengl SDK
        if: always() && steps.glcache.outputs.cache-hit != 'true' && hashFiles('third_party/PS5SD/.deps/ps5-opengl-sdk.stamp') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/PS5SD/.deps/ps5-opengl-sdk
            third_party/PS5SD/.deps/ps5-opengl-sdk.stamp
          key: ps5-opengl-sdk-${{ hashFiles('third_party/PS5SD/scripts/build-opengl-sdk.sh') }}

      - name: Build the title
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work "$IMAGE" \
            bash -c 'git config --global --add safe.directory "*" && bash scripts/build-mg.sh'

      # The launch payload for PPSA99577 (scripts/build-launcher.sh: PS5SD's script pins the title id to its own).
      - name: Build the launch payload
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work "$IMAGE"             bash -c 'git config --global --add safe.directory "*" && bash scripts/build-launcher.sh'

      # The container ran as root; hand the files back before the cache is saved.
      - name: Give the files back to the runner
        if: always()
        run: |
          docker run --rm -v "$PWD":/work -w /work "$IMAGE" chown -R "$(id -u):$(id -g)" /work || true

      # The title folder as a zip (PPSA99577/ at the top) with its checksum: what a release carries.
      - name: Package
        run: |
          mkdir -p dist
          (cd build/title && zip -qr9 ../../dist/PPSA99577.zip PPSA99577)
          cp build/tools/launch-mg.elf dist/
          (cd dist && sha256sum PPSA99577.zip launch-mg.elf | tee SHA256SUMS)

      - name: Upload the title
        uses: actions/upload-artifact@v4
        with:
          name: ps5mg-title
          path: build/title
          if-no-files-found: error

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: ps5mg-release
          path: dist
          if-no-files-found: error

      - name: Upload the launch payload
        uses: actions/upload-artifact@v4
        with:
          name: ps5mg-tools
          path: build/tools/launch-mg.elf
          if-no-files-found: error

  # A tag v* publishes a release with the title zip (docs/RELEASE-NOTES.md as its description).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: title
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the build attestation
      attestations: write    # store it
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: ps5mg-release
          path: dist
      # Ties the zip to this workflow run and commit (check: gh attestation verify PPSA99577.zip --repo nikay99/PS5MG)
      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/PPSA99577.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only the title zip: the PS5 homebrew catalog wants exactly one installable file per release
          gh release create "$GITHUB_REF_NAME" dist/PPSA99577.zip --repo "$GITHUB_REPOSITORY" --title "PS5MG ${GITHUB_REF_NAME#v}"             --notes-file docs/RELEASE-NOTES.md
